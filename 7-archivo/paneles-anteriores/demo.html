<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F3F1EA">
<title>SCHOLAIA Secretaría</title>
<meta name="description" content="Panel diario del asistente SCHOLAIA: trabajo ahorrado, huecos de la base de conocimiento y trámites pendientes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   SCHOLAIA · Panel de secretaría — hoja de estilos
   ============================================================ */

* { box-sizing: border-box; }

:root {
  color-scheme: light;

  /* ---- Primitivas: las de la web de SCHOLAIA. Los nombres se conservan
       (slate-900, primary...) porque toda la capa semantica de abajo cuelga
       de ellos; lo que cambia son los valores: papel calido y tinta. ---- */
  --font-display: 'Schibsted Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body:    'Literata', Georgia, "Times New Roman", serif;
  /* No hay monoespaciada en el sistema. Las cifras se alinean con
     font-variant-numeric, no cambiando de tipografia. */
  --font-mono:    'Schibsted Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  /* La rampa va de la noche al papel, no del negro azulado al blanco. */
  --slate-950:#0E1013; --slate-900:#15171B; --slate-800:#20232A; --slate-700:#31353D;
  --slate-600:#484A4F; --slate-500:#5E6167; --slate-400:#A5A093; --slate-300:#C9C6BE;
  --slate-200:#DCD8CD; --slate-100:#EAE7DE; --slate-50:#F3F1EA; --white:#FFFFFF;

  /* El azul de boligrafo, unico acento. */
  --primary:#1B4B8F; --primary-hover:#14396B; --primary-light:#EDF1F8;
  --primary-border:#C3D2E8; --primary-focus:#8FB3E8; --accent:#15171B;

  /* Las tres tintas de correccion. Apagadas, para que se lean sobre papel
     sin gritar, y distinguibles entre si. */
  --danger:#9A3324; --danger-soft:#F8EEEB; --danger-border:#E3C9C2;
  --success:#2F6B4F; --success-soft:#EDF3EF; --success-border:#C9DCD0;
  --holiday-dot:#8A5A16;

  /* En noche las tres suben de tono para seguir leyendose. */
  --danger-noche:#E8A99B; --success-noche:#7FB894; --ambar-noche:#D9AE6B;

  /* Sin cajas flotantes: separa el filete, no la sombra. La unica sombra
     real se reserva para lo que de verdad se superpone a la pagina. */
  --shadow-xs: none;
  --shadow-sm: none;
  --shadow-md: none;
  --shadow-lg: 0 18px 44px -14px rgba(21,23,27,.30);

  --radius-xs:4px; --radius-sm:4px; --radius-md:4px; --radius-lg:6px; --radius-full:4px;

  --transition-fast: .12s ease-out;
  --transition-smooth: .18s ease;
  --spring-bounce: .28s cubic-bezier(.23,1,.32,1);

  /* ---- Capa semántica del panel: alias sobre las primitivas de arriba ---- */
  --font-sans: var(--font-body);

  /* Superficies */
  --bg: var(--slate-50);
  --surface: var(--white);
  --surface-2: var(--slate-100);
  --surface-hover: var(--slate-100);
  --border: var(--slate-200);
  --border-strong: var(--slate-300);

  /* Tinta */
  --ink: var(--slate-900);
  --ink-secondary: var(--slate-600);
  --ink-muted: var(--slate-500);
  --ink-on-accent: var(--white);

  /* Marca — azul solo como acento (enlaces, barras de datos, estados activos) */
  --accent: var(--primary);
  --accent-hover: var(--primary-hover);
  --accent-ink: var(--primary-hover);
  --accent-soft: var(--primary-border);
  --accent-wash: var(--primary-light);

  /* Botón principal — pizarra, no azul: es el rasgo distintivo del sistema */
  --boton-primario-bg: var(--slate-900);
  --boton-primario-bg-hover: var(--slate-800);
  --boton-primario-texto: var(--white);

  /* Semánticos */
  --exito: var(--success);
  --exito-ink: #047857; /* = --vacation-text del producto (01 - Chatbot Sin IA/style.css) */
  --exito-soft: var(--success-soft);
  --alerta: var(--danger);
  --alerta-ink: var(--danger);
  --alerta-soft: var(--danger-soft);
  --ambar: var(--holiday-dot);
  --ambar-ink: #92400e;  /* = tinta del chat-banner-warning del producto */
  --ambar-soft: #fffbeb; /* = fondo del chat-banner-warning del producto */

  --sombra-sm: var(--shadow-sm);
  --sombra-md: var(--shadow-md);
  --sombra-lg: var(--shadow-lg);

  /* --radius-sm / --radius-md / --radius-lg ya llegan con los valores
     correctos (8 / 12 / 18px) desde las primitivas de arriba: no hace
     falta redeclararlas (y hacerlo como auto-referencia las invalidaría). */
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: var(--slate-950);
    --surface: var(--slate-900);
    --surface-2: var(--slate-800);
    --surface-hover: var(--slate-700);
    --border: var(--slate-800);
    --border-strong: var(--slate-700);

    --ink: var(--slate-50);
    --ink-secondary: var(--slate-300);
    --ink-muted: var(--slate-400);
    --ink-on-accent: var(--slate-950);

    --accent: var(--primary-focus);
    --accent-hover: var(--primary-focus);
    --accent-ink: var(--primary-focus);
    --accent-soft: color-mix(in srgb, var(--primary-focus) 18%, transparent);
    --accent-wash: color-mix(in srgb, var(--primary-focus) 10%, transparent);

    /* El relleno pizarra del botón principal se hunde en un fondo ya oscuro:
       en este tema se usa el azul de marca para mantener el contraste. */
    /* En noche el boton principal se invierte: papel sobre tinta. El azul
       de boligrafo sobre un fondo ya oscuro se hunde. */
    --boton-primario-bg: var(--slate-50);
    --boton-primario-bg-hover: var(--white);
    --boton-primario-texto: var(--slate-900);

    --exito-ink: var(--success-noche);
    --exito-soft: color-mix(in srgb, var(--success-noche) 16%, transparent);
    --alerta-ink: var(--danger-noche);
    --alerta-soft: color-mix(in srgb, var(--danger-noche) 16%, transparent);
    --ambar-ink: var(--ambar-noche);
    --ambar-soft: color-mix(in srgb, var(--ambar-noche) 16%, transparent);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: var(--slate-950);
  --surface: var(--slate-900);
  --surface-2: var(--slate-800);
  --surface-hover: var(--slate-700);
  --border: var(--slate-800);
  --border-strong: var(--slate-700);

  --ink: var(--slate-50);
  --ink-secondary: var(--slate-300);
  --ink-muted: var(--slate-400);
  --ink-on-accent: var(--slate-950);

  --accent: var(--primary-focus);
  --accent-hover: var(--primary-focus);
  --accent-ink: var(--primary-focus);
  --accent-soft: color-mix(in srgb, var(--primary-focus) 18%, transparent);
  --accent-wash: color-mix(in srgb, var(--primary-focus) 10%, transparent);

  /* En noche el boton principal se invierte: papel sobre tinta. */
  --boton-primario-bg: var(--slate-50);
  --boton-primario-bg-hover: var(--white);
  --boton-primario-texto: var(--slate-900);

  --exito-ink: var(--success-noche);
  --exito-soft: color-mix(in srgb, var(--success-noche) 16%, transparent);
  --alerta-ink: var(--danger-noche);
  --alerta-soft: color-mix(in srgb, var(--danger-noche) 16%, transparent);
  --ambar-ink: var(--ambar-noche);
  --ambar-soft: color-mix(in srgb, var(--ambar-noche) 16%, transparent);
}

html { -webkit-text-size-adjust: 100%; }

/* Sin monoespaciada: un nombre de archivo se marca con el papel, no
   cambiando de tipografia. */
code {
  font-family: var(--font-display);
  font-size: .94em;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  padding: 1px 5px;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

@media (prefers-reduced-motion: no-preference) {
  .anim-fade { animation: fade-up .5s cubic-bezier(.16,1,.3,1) both; }
}

@keyframes fade-up {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

h1, h2, h3 { margin: 0; font-family: var(--font-display); font-weight: 700; letter-spacing: -0.025em; text-wrap: balance; }

button, input, select { font-family: inherit; font-size: inherit; color: inherit; }

.tabular { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ---------- estructura general ---------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px 16px;
  padding: 14px clamp(16px, 4vw, 40px);
  background: color-mix(in srgb, var(--surface) 90%, transparent);
  backdrop-filter: blur(10px) saturate(140%);
  -webkit-backdrop-filter: blur(10px) saturate(140%);
  border-bottom: 1px solid var(--border);
}

.marca {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  flex-shrink: 1;
}

/* El logotipo real de la marca: dos lineas, dos tipografias. En noche se
   invierte, porque el original es tinta oscura sobre transparente. */
.marca .logotipo {
  width: 84px;
  height: auto;
  display: block;
  flex-shrink: 0;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .marca .logotipo { filter: invert(1); }
}

:root[data-theme="dark"] .marca .logotipo { filter: invert(1); }
:root[data-theme="light"] .marca .logotipo { filter: none; }

.marca .centro-nombre {
  font-size: 13px;
  color: var(--ink-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  border-left: 1px solid var(--border-strong);
  padding-left: 10px;
  min-width: 0;
}

.topbar-derecha {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

@media (max-width: 480px) {
  .marca .centro-nombre { display: none; }
}

.wrap {
  max-width: 1240px;
  margin: 0 auto;
  padding: clamp(20px, 4vw, 40px) clamp(16px, 4vw, 40px) 64px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--sombra-sm);
}

.marcador {
  padding: 60px 20px;
  color: var(--ink-muted);
  text-align: center;
  font-size: 14px;
}

/* ---------- botones y controles ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--ink);
  padding: 8px 14px;
  border-radius: var(--radius-full);
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition-smooth);
  white-space: nowrap;
}
.btn:hover { background: var(--surface-hover); border-color: var(--ink-muted); transform: translateY(-1px); box-shadow: var(--sombra-sm); }
.btn:active { transform: scale(.97); transition: transform 80ms ease-out; }
.btn-accent {
  background: var(--boton-primario-bg);
  border-color: var(--boton-primario-bg);
  color: var(--boton-primario-texto);
}
.btn-accent:hover { background: var(--boton-primario-bg-hover); border-color: var(--boton-primario-bg-hover); }
.btn-ghost {
  border-color: transparent;
  background: transparent;
}
.btn-ghost:hover { background: var(--surface-hover); }
/* El radio se hereda de .btn a propósito: en el sistema del producto el botón
   pequeño de la barra superior (.btn-primary-sm) también es una píldora. */
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }

.icono-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--ink-secondary);
  cursor: pointer;
  transition: background var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast);
}
.icono-btn:hover { background: var(--surface-hover); color: var(--ink); border-color: var(--ink-muted); }
.icono-btn:active { transform: scale(.92); transition: transform 80ms ease-out; }
.icono-btn svg { width: 17px; height: 17px; }

/* ---------- insignias de estado ---------- */

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 11px 5px 9px;
  border-radius: var(--radius-full);
  font-family: var(--font-display);
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: .01em;
  white-space: nowrap;
}
.badge .punto { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.badge-demo { background: var(--ambar-soft); color: var(--ambar-ink); }
.badge-demo .punto { background: var(--ambar); }
.badge-vivo { background: var(--exito-soft); color: var(--exito-ink); }
.badge-vivo .punto { background: var(--exito); box-shadow: 0 0 0 3px color-mix(in srgb, var(--exito) 25%, transparent); }
.badge-vacio { background: var(--accent-wash); color: var(--accent-ink); }
.badge-vacio .punto { background: var(--accent); }

/* ---------- aviso de conexión / login ---------- */

.aviso-conexion {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: var(--radius-md);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
.aviso-conexion p { margin: 0; color: var(--ink-secondary); font-size: 13.5px; }
.aviso-conexion strong { color: var(--ink); }

.panel-login {
  display: none;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  margin-left: auto;
}
.panel-login.abierto { display: flex; }
.panel-login input[type="password"] {
  border: 1px solid var(--border-strong);
  background: var(--bg);
  color: var(--ink);
  border-radius: var(--radius-sm);
  padding: 7px 10px;
  width: 180px;
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}
.panel-login input[type="password"]:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-wash);
}
.mensaje-login { font-size: 12.5px; color: var(--alerta-ink); min-width: 100%; }

/* ---------- cabecera de sección ---------- */

.seccion-titulo {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 4px;
}
.seccion-titulo h2 { font-size: 22px; }
.seccion-titulo .subtitulo { font-size: 13px; color: var(--ink-muted); font-family: var(--font-sans); }

/* ---------- hero: trabajo ahorrado ---------- */

.hero {
  padding: 28px clamp(20px, 3vw, 32px) 30px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}
.hero-cabecera h1 { font-size: clamp(24px, 3vw, 30px); }
.hero-cabecera .subtitulo { margin-top: 4px; font-size: 13.5px; color: var(--ink-muted); }

.stat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}
@media (max-width: 760px) {
  .stat-grid { grid-template-columns: 1fr; }
}

.stat-tile {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.stat-tile .stat-etiqueta {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0;
  color: var(--ink-muted);
  display: flex;
  align-items: center;
  gap: 6px;
}
.stat-tile .stat-valor {
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: clamp(28px, 4vw, 36px);
  line-height: 1.05;
  color: var(--ink);
  font-variant-numeric: proportional-nums;
}
.stat-tile .stat-valor .unidad { font-family: var(--font-sans); font-size: 15px; font-weight: 700; color: var(--ink-secondary); margin-left: 4px; }
.stat-tile .stat-nota { font-size: 12px; color: var(--ink-muted); }
.stat-tile.acento { background: var(--surface-2); border-color: var(--border-strong); }
.stat-tile.acento .stat-valor { color: var(--accent-ink); }

.pastilla-estimacion {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0;
  color: var(--ambar-ink);
  background: var(--ambar-soft);
  padding: 2px 7px;
  border-radius: var(--radius-full);
}

.supuestos {
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-md);
  padding: 14px 18px;
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  align-items: center;
  background: var(--surface-2);
}
.supuestos .supuestos-intro { font-size: 12.5px; color: var(--ink-secondary); flex-basis: 100%; }
.supuestos .supuestos-intro strong { color: var(--ink); }
.control-supuesto { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-secondary); }
.control-supuesto input[type="range"] { accent-color: var(--accent); width: 120px; }
.control-supuesto .valor-supuesto { font-family: var(--font-mono); font-weight: 600; color: var(--ink); min-width: 2.5em; text-align: right; }

.tendencia-envoltorio {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.tendencia-envoltorio .tendencia-titulo {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0;
  color: var(--ink-muted);
}
.grafica-contenedor { overflow-x: auto; }
.grafica-contenedor svg { display: block; overflow: visible; }

.tooltip-grafica {
  position: fixed;
  pointer-events: none;
  background: var(--ink);
  color: var(--bg);
  font-size: 12px;
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  box-shadow: var(--sombra-md);
  z-index: 100;
  opacity: 0;
  transition: opacity .1s ease;
  white-space: nowrap;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .tooltip-grafica { background: var(--surface-2); color: var(--ink); border: 1px solid var(--border-strong); }
}
:root[data-theme="dark"] .tooltip-grafica { background: var(--surface-2); color: var(--ink); border: 1px solid var(--border-strong); }
.tooltip-grafica.visible { opacity: 1; }
.tooltip-grafica .tt-linea2 { color: var(--ink-muted); }

/* ---------- rejilla de dos columnas ---------- */

.grid-2 {
  display: grid;
  grid-template-columns: 1.15fr 1fr;
  gap: 20px;
  align-items: start;
}
@media (max-width: 900px) {
  .grid-2 { grid-template-columns: 1fr; }
}

.panel-cuerpo { padding: 22px clamp(18px, 3vw, 26px) 26px; display: flex; flex-direction: column; gap: 18px; }

/* ---------- gráfica de categorías ---------- */

.barra-fila { display: flex; align-items: center; gap: 10px; padding: 5px 0; cursor: default; }
.barra-fila .barra-etiqueta {
  flex: 0 0 150px;
  font-size: 12.5px;
  color: var(--ink-secondary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.barra-fila .barra-pista {
  flex: 1;
  height: 16px;
  background: var(--surface-2);
  border-radius: 6px;
  overflow: hidden;
  position: relative;
}
.barra-fila .barra-relleno {
  position: absolute;
  inset: 0 auto 0 0;
  border-radius: 6px;
  background: var(--accent);
  transition: filter .12s ease;
}
.barra-fila:hover .barra-relleno { filter: brightness(1.12); }
.barra-fila.top .barra-relleno { background: var(--accent-hover); }
.barra-fila .barra-valor {
  flex: 0 0 34px;
  text-align: right;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--ink);
}

/* ---------- huecos / sin resolver ---------- */

.huecos-intro {
  background: var(--alerta-soft);
  border: 1px solid color-mix(in srgb, var(--alerta) 30%, transparent);
  border-radius: var(--radius-md);
  padding: 12px 16px;
  font-size: 13px;
  color: var(--alerta-ink);
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .huecos-intro { color: var(--ink); } }
:root[data-theme="dark"] .huecos-intro { color: var(--ink); }
.huecos-intro svg { flex-shrink: 0; margin-top: 1px; }
.huecos-intro { flex-wrap: wrap; }
.contador-huecos-badge {

function construirTendenciaDemo() {
  const hoy = new Date();

  for (let i = 11; i >= 0; i--) {
    const f = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);

  return puntos;
}

/* ----------------------------------------------------------------------
   2. TENDENCIA A PARTIR DE DATOS REALES (cuando hay servidor)
   La API no da un desglose mensual, así que se agrupan las últimas
   consultas por día si el rango es corto, o por mes si es amplio.
   -------------------------------------------------------------------- */

function construirTendenciaDesdeConsultas(consultas) {
  if (!consultas || !consultas.length) return [];
  const fechas = consultas.map((c) => new Date(c.creada_en)).filter((f) => !isNaN(f));
  if (!fechas.length) return [];
  const minimo = new Date(Math.min(...fechas));
  const maximo = new Date(Math.max(...fechas));
  const rangoDias = (maximo - minimo) / 86400000;

  const cubos = new Map();
  const porMes = rangoDias > 45;

  consultas.forEach((c) => {
    const f = new Date(c.creada_en);
    if (isNaN(f)) return;
    const clave = porMes
      ? `${f.getFullYear()}-${f.getMonth()}`
      : `${f.getFullYear()}-${f.getMonth()}-${f.getDate()}`;
    cubos.set(clave, (cubos.get(clave) || 0) + 1);
  });

  const claves = Array.from(cubos.keys()).sort();
  return claves.map((clave) => {
    const partes = clave.split('-').map(Number);
    const f = porMes ? new Date(partes[0], partes[1], 1) : new Date(partes[0], partes[1], partes[2]);
    const etiqueta = porMes
      ? f.toLocaleDateString('es-ES', { month: 'short' }).replace('.', '')
      : f.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }).replace('.', '');
    return { etiqueta, valor: cubos.get(clave) };
  });
}

  const f = new Date(iso);

  const ahora = new Date();
  const dias = Math.floor((ahora.setHours(0, 0, 0, 0) - new Date(f).setHours(0, 0, 0, 0)) / 86400000);

  if (dias < 14) return 'hace 1 semana';

}

    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function nombreCategoria(id) {
  return NOMBRES_CATEGORIA[id] || (id ? id.charAt(0).toUpperCase() + id.slice(1) : 'General');
}

const ETIQUETAS_TIPO_SOLICITUD = {
  matricula: 'Matrícula',
  cita_tutor: 'Cita con tutor',
  baja_comedor: 'Baja de comedor',
  beca_comedor: 'Beca de comedor',
  certificado: 'Certificado',
  cambio_datos: 'Cambio de datos',
  informacion_fp: 'Información de FP',
  tramite: 'Trámite general'
};
function nombreTipoSolicitud(t) {
  return ETIQUETAS_TIPO_SOLICITUD[t] || (t ? t.charAt(0).toUpperCase() + t.slice(1).replace(/_/g, ' ') : 'Trámite');
}

function mostrarToast(texto) {
  const cont = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = texto;
  cont.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .25s ease'; }, 2400);
  setTimeout(() => el.remove(), 2700);
}

function aplicarTema() {
  const root = document.documentElement;
  if (estado.tema === 'claro') root.setAttribute('data-theme', 'light');
  else if (estado.tema === 'oscuro') root.setAttribute('data-theme', 'dark');
  else root.removeAttribute('data-theme');
}

  estado.tema = estado.tema === 'sistema' ? 'claro' : estado.tema === 'claro' ? 'oscuro' : 'sistema';
  localStorage.setItem('scholaia_tema', estado.tema);
  aplicarTema();
  const etiquetas = { sistema: 'automático (según el sistema)', claro: 'claro', oscuro: 'oscuro' };

}

/* ----------------------------------------------------------------------
   6. CARGA DE DATOS: intenta servidor real, si no cae a demo
   -------------------------------------------------------------------- */

async function pedirMetricas(token) {
  const resp = await fetch('/api/admin/metricas', {
    headers: token ? { Authorization: 'Bearer ' + token } : {}
  });
  if (!resp.ok) {
    const err = new Error('HTTP ' + resp.status);
    err.status = resp.status;
    throw err;
  }
  return resp.json();
}

// Endpoint público (sin login): sirve para mostrar el nombre real del
// centro incluso en modo demo, si el servidor está accesible.
async function pedirNombreCentroPublico() {
  try {
    const resp = await fetch('/api/salud');
    if (!resp.ok) return null;
    const datos = await resp.json();
    return datos.centro || null;
  } catch (error) {
    return null;
  }
}

async function cargarDatos() {
  if (estado.token) {
    try {
      const datos = await pedirMetricas(estado.token);
      if (datos.totales && datos.totales.consultas >= UMBRAL_DATOS_MINIMOS) {
        estado.conexion = 'vivo';
        estado.datos = datos;
        estado.datos._tendencia = construirTendenciaDesdeConsultas(datos.ultimas_consultas);
        renderizarTodo();
        return;
      }
      // Servidor conectado pero con poco historial: se ilustra con demo,
      // sin perder la conexión real (ya no hace falta el botón "conectar").
      estado.conexion = 'vivo_vacio';
      estado.centroReal = datos.centro;
      estado.datos = construirDatosDemo();
      estado.datos.centro = datos.centro || estado.datos.centro;
      renderizarTodo();
      return;
    } catch (error) {
      if (error.status === 401) {
        sessionStorage.removeItem(CLAVE_TOKEN);
        estado.token = '';
      }
      // sigue abajo, cae a demo
    }
  }
  estado.conexion = 'demo';
  estado.datos = construirDatosDemo();
  renderizarTodo();

  // No bloquea el primer pintado: si el servidor responde, se afina el
  // nombre del centro sin tener que iniciar sesión.
  const nombreReal = await pedirNombreCentroPublico();
  if (nombreReal && estado.conexion === 'demo') {
    estado.datos.centro = nombreReal;
    renderizarCabecera();
  }
}

async function iniciarSesion(password) {
  const resp = await fetch('/api/admin/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password })
  });
  const datos = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(datos.error || 'Contraseña incorrecta.');
  estado.token = datos.token;
  sessionStorage.setItem(CLAVE_TOKEN, datos.token);
}

document.getElementById('btnConectar').addEventListener('click', () => {

});
document.getElementById('btnCancelarLogin').addEventListener('click', () => {
  document.getElementById('panelLogin').classList.remove('abierto');

document.getElementById('formLogin').addEventListener('submit', async (ev) => {

  const input = document.getElementById('inputPassword');

/* ----------------------------------------------------------------------
   8. RENDER — gráfica de tendencia (área, SVG a mano)
   -------------------------------------------------------------------- */

function dibujarTendencia(puntos) {
  if (!puntos || !puntos.length) return '<p class="vacio-lista">Aún no hay suficiente histórico para mostrar una tendencia.</p>';

  const ancho = 640, alto = 108, padI = 8, padD = 8, padSup = 10, padInf = 22;
  const max = Math.max(...puntos.map((p) => p.valor), 1);
  const n = puntos.length;
  const pasoX = (ancho - padI - padD) / Math.max(n - 1, 1);

  const coords = puntos.map((p, i) => {
    const x = padI + i * pasoX;
    const y = padSup + (1 - p.valor / max) * (alto - padSup - padInf);
    return { x, y, ...p };
  });

  const linea = coords.map((c, i) => (i === 0 ? 'M' : 'L') + c.x.toFixed(1) + ' ' + c.y.toFixed(1)).join(' ');
  const area = linea + ` L${coords[coords.length - 1].x.toFixed(1)} ${(alto - padInf).toFixed(1)} L${coords[0].x.toFixed(1)} ${(alto - padInf).toFixed(1)} Z`;

  const puntosSvg = coords.map((c, i) => `
    <circle class="punto-tendencia" data-i="${i}" cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="9" fill="transparent" style="cursor:pointer" />
    <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="${i === n - 1 ? 3.5 : 2.5}" fill="var(--accent)" ${i === n - 1 ? 'stroke="var(--surface)" stroke-width="2"' : ''} />
  `).join('');

  const etiquetasSvg = coords.map((c, i) => (
    (i % Math.max(Math.ceil(n / 12), 1) === 0 || i === n - 1)
      ? `<text x="${c.x.toFixed(1)}" y="${alto - 6}" text-anchor="middle" font-size="9.5" fill="var(--ink-muted)" font-family="var(--font-sans)">${escaparHtml(c.etiqueta)}</text>`
      : ''
  )).join('');

  return `
    <svg viewBox="0 0 ${ancho} ${alto}" width="100%" height="${alto}" role="img" aria-label="Tendencia de consultas a lo largo del tiempo">
      <defs>
        <linearGradient id="gradTendencia" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.28" />
          <stop offset="100%" stop-color="var(--accent)" stop-opacity="0" />
        </linearGradient>
      </defs>
      <line x1="${padI}" y1="${(alto - padInf).toFixed(1)}" x2="${ancho - padD}" y2="${(alto - padInf).toFixed(1)}" stroke="var(--border-strong)" stroke-width="1" />
      <path d="${area}" fill="url(#gradTendencia)" />
      <path d="${linea}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      ${puntosSvg}
      ${etiquetasSvg}
    </svg>`;
}

function activarTooltipsTendencia(puntos) {
  const tt = document.getElementById('tooltipTendencia');
  document.querySelectorAll('.punto-tendencia').forEach((c) => {
    c.addEventListener('mouseenter', (ev) => {
      const p = puntos[Number(c.dataset.i)];
      tt.innerHTML = `<strong class="tabular">${formatoNumero(p.valor)}</strong> consultas <span class="tt-linea2">· ${escaparHtml(p.etiqueta)}</span>`;
      tt.classList.add('visible');
    });
    c.addEventListener('mousemove', (ev) => {
      tt.style.left = (ev.clientX + 14) + 'px';
      tt.style.top = (ev.clientY - 12) + 'px';
    });
    c.addEventListener('mouseleave', () => tt.classList.remove('visible'));
  });
}

function copiarHueco(texto, btn) {
  const hacer = () => {
    const original = btn.textContent;
    btn.textContent = 'Copiado';
    btn.disabled = true;
    setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1500);
  };

  // Se prueba primero el método síncrono (textarea + execCommand): funciona
  // sin permisos ni contexto seguro, algo relevante porque este panel se
  // enseña a menudo embebido en una vista previa (p. ej. un Artifact), donde
  // la API asíncrona del portapapeles puede quedarse esperando un permiso
  // que nunca llega. Si no está disponible, se prueba la API moderna.
  let copiadoSincrono = false;
  try {
    const area = document.createElement('textarea');
    area.value = texto;
    area.style.position = 'fixed';
    area.style.top = '0';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.focus();
    area.select();
    copiadoSincrono = document.execCommand && document.execCommand('copy');
    area.remove();
  } catch (error) {
    copiadoSincrono = false;
  }

  if (copiadoSincrono) {
    hacer();
    return;
  }

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(texto).then(hacer).catch(() => mostrarToast('No se ha podido copiar. Selecciona el texto a mano.'));
  } else {
    mostrarToast('No se ha podido copiar. Selecciona el texto a mano.');
  }
}

function renderizarHuecos() {
  const lista = (estado.datos.sin_resolver || []).slice(0, 8);
  const cont = document.getElementById('contenedorHuecos');
  document.getElementById('contadorHuecos').textContent = lista.length
    ? `${lista.length} sin responder`
    : 'sin huecos detectados';

  if (!lista.length) {
    cont.innerHTML = '<p class="vacio-lista">No hay consultas sin resolver ahora mismo. La base de conocimiento cubre todo lo que se está preguntando.</p>';
    return;
  }

  cont.innerHTML = lista.map((s, i) => `
    <div class="hueco-item">
      <span class="hueco-texto">${escaparHtml(s.consulta)}</span>
      <span class="hueco-meta">
        <span class="hueco-fecha">${escaparHtml(formatoFechaRelativa(s.creada_en))}</span>
        <button type="button" class="btn btn-sm" data-copiar-hueco="${i}">Copiar para la FAQ</button>
      </span>
    </div>`).join('');

  cont.querySelectorAll('[data-copiar-hueco]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const item = lista[Number(btn.dataset.copiarHueco)];
      copiarHueco(item.consulta, btn);
    });
  });
}

/* ----------------------------------------------------------------------
   11. RENDER — trámites pendientes (kanban)
   -------------------------------------------------------------------- */

const COLUMNAS_ESTADO = [
  { estado: 'pendiente', titulo: 'Pendientes' },
  { estado: 'en_tramite', titulo: 'En trámite' },
  { estado: 'completado', titulo: 'Completados' }
];

function chipAntiguedad(dias, estadoTramite) {
  if (estadoTramite === 'completado') return '';
  if (dias >= 10) return `<span class="chip-antiguedad critico">${dias} días sin tocar</span>`;
  if (dias >= 4) return `<span class="chip-antiguedad aviso">${dias} días</span>`;
  return '';
}

function renderizarTramites() {
  const solicitudes = estado.datos.solicitudes || [];
  const puedeEscribir = estado.conexion === 'vivo';

  COLUMNAS_ESTADO.forEach((col) => {
    const items = solicitudes
      .filter((s) => s.estado === col.estado)
      .sort((a, b) => new Date(a.creada_en) - new Date(b.creada_en));

    const contenedorCol = document.querySelector(`.kanban-col[data-estado="${col.estado}"] .kanban-col-lista`);
    document.querySelector(`.kanban-col[data-estado="${col.estado}"] .contador`).textContent = items.length;

    if (!items.length) {
      contenedorCol.innerHTML = '<div class="kanban-vacio">Nada aquí</div>';
      return;
    }

    contenedorCol.innerHTML = items.map((s) => {
      const dias = diasDesde(s.creada_en);
      const avisar = col.estado !== 'completado' && dias >= 10;
      return `
      <div class="tramite-tarjeta${avisar ? ' aviso' : ''}" data-id="${s.id}">
        <div class="tramite-top">
          <span class="tramite-nombre">${escaparHtml(s.nombre)}</span>
        </div>
        <div class="tramite-tipo">${escaparHtml(nombreTipoSolicitud(s.tipo))}</div>
        <div class="tramite-mensaje">${escaparHtml(s.mensaje || '')}</div>
        ${s.telefono ? `<div class="tramite-contacto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L14 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 2 6a2 2 0 0 1 2-2Z"/></svg>${escaparHtml(s.telefono)}</div>` : ''}
        ${chipAntiguedad(dias, col.estado)}
        <div class="tramite-pie">
          <span class="tramite-antiguedad">${escaparHtml(formatoFechaRelativa(s.creada_en))}</span>
          <select data-cambiar-estado="${s.id}" aria-label="Cambiar estado del trámite de ${escaparHtml(s.nombre)}">
            <option value="pendiente"${s.estado === 'pendiente' ? ' selected' : ''}>Pendiente</option>
            <option value="en_tramite"${s.estado === 'en_tramite' ? ' selected' : ''}>En trámite</option>
            <option value="completado"${s.estado === 'completado' ? ' selected' : ''}>Completado</option>
          </select>
        </div>
      </div>`;
    }).join('');
  });

  document.querySelectorAll('[data-cambiar-estado]').forEach((sel) => {
    sel.addEventListener('change', (ev) => {
      cambiarEstadoTramite(Number(sel.dataset.cambiarEstado), ev.target.value, puedeEscribir);
    });
  });
}

async function cambiarEstadoTramite(id, nuevoEstado, esVivo) {
  const sol = (estado.datos.solicitudes || []).find((s) => s.id === id);
  if (!sol) return;
  const anterior = sol.estado;
  sol.estado = nuevoEstado;
  estado.datos.totales.solicitudes_pendientes = (estado.datos.solicitudes || []).filter((s) => s.estado === 'pendiente').length;
  renderizarTramites();
  renderizarHero();

  if (!esVivo) {
    mostrarToast('Cambiado en esta vista de ejemplo (no se guarda en el servidor).');
    return;
  }

  try {
    const resp = await fetch('/api/admin/solicitudes/estado', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + estado.token },
      body: JSON.stringify({ id, estado: nuevoEstado })
    });
    if (!resp.ok) throw new Error();
    mostrarToast('Trámite de ' + sol.nombre + ' actualizado a "' + nombreEstadoLegible(nuevoEstado) + '".');
  } catch (error) {
    sol.estado = anterior;
    estado.datos.totales.solicitudes_pendientes = (estado.datos.solicitudes || []).filter((s) => s.estado === 'pendiente').length;
    renderizarTramites();
    renderizarHero();
    mostrarToast('No se ha podido guardar el cambio. Comprueba la conexión.');
  }
}
function nombreEstadoLegible(e) {
  return e === 'pendiente' ? 'pendiente' : e === 'en_tramite' ? 'en trámite' : 'completado';
}

          Minutos medios por llamada atendida:
          <input type="range" id="sliderMinutos" min="1" max="12" step="1" value="4">
          <span class="valor-supuesto tabular" id="valorSliderMinutos">4 min</span>
        </label>
      </div>

      <div class="tendencia-envoltorio">
        <span class="tendencia-titulo">Volumen de consultas</span>
        <div class="grafica-contenedor" id="contenedorTendencia"></div>
      </div>
    </section>

    <div class="grid-2">
      <article class="panel anim-fade">
        <div class="panel-cuerpo">
          <div class="seccion-titulo">
            <h2>Qué preguntan y qué falla</h2>
            <span class="subtitulo">Categorías más frecuentes</span>
          </div>
          <div class="grafica-contenedor" id="contenedorCategorias"></div>

          <div class="huecos-intro">
            ${ICONO_INFO}
            <span>Estas preguntas se le escapan al asistente. Son huecos reales de la base de conocimiento — añádelas a <code>preguntas_frecuentes.json</code> y desaparecerán de esta lista.</span>
            <strong id="contadorHuecos" class="contador-huecos-badge"></strong>
          </div>
          <div class="lista-huecos" id="contenedorHuecos"></div>
        </div>
      </article>

      <article class="panel anim-fade">
        <div class="panel-cuerpo">
          <div class="seccion-titulo">
            <h2>Trámites pendientes</h2>
            <span class="subtitulo">Cambia el estado según los vayas gestionando</span>
          </div>
          <div class="kanban">
            ${COLUMNAS_ESTADO.map((c) => `
              <div class="kanban-col" data-estado="${c.estado}">
                <div class="kanban-col-cabecera"><span>${c.titulo}</span><span class="contador tabular">0</span></div>
                <div class="kanban-col-lista"></div>
              </div>`).join('')}
          </div>
        </div>
      </article>
    </div>
  `;

  document.getElementById('sliderLlamadas').addEventListener('input', (ev) => {
    estado.supuestoLlamadas = Number(ev.target.value);
    renderizarHero();
  });
  document.getElementById('sliderMinutos').addEventListener('input', (ev) => {
    estado.minutosPorLlamada = Number(ev.target.value);
    renderizarHero();
  });
}

/* ----------------------------------------------------------------------
   13. ARRANQUE
   -------------------------------------------------------------------- */

function renderizarTodo() {
  renderizarCabecera();
  renderizarHero();
  renderizarCategorias();
  renderizarHuecos();
  renderizarTramites();
}

(function inicializar() {
  const tt = document.createElement('div');
  tt.id = 'tooltipTendencia';
  tt.className = 'tooltip-grafica';
  document.body.appendChild(tt);

  construirEstructuraPrincipal();
  cargarDatos();
})();
</script>
</body>
</html>
